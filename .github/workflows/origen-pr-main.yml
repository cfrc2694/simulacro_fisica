# main solo acepta pull requests desde develop o desde ramas hotfix/*.
# El job "origen-del-pr" está configurado como check obligatorio en la
# protección de main, así que un PR desde otra rama no se puede fusionar.
name: Origen de PR a main

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  origen:
    name: origen-del-pr
    runs-on: ubuntu-latest
    steps:
      - name: Verificar la rama de origen
        env:
          RAMA: ${{ github.head_ref }}
          REPO_ORIGEN: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO_ORIGEN" != "$REPO" ]; then
            echo "::error::main solo acepta PR desde ramas de este repositorio; este viene de $REPO_ORIGEN."
            exit 1
          fi
          case "$RAMA" in
            develop|hotfix/*)
              echo "Origen permitido: $RAMA"
              ;;
            *)
              echo "::error::main solo acepta PR desde develop o desde hotfix/*; este PR viene de '$RAMA'."
              exit 1
              ;;
          esac
